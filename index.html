<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aero Weather (3D Premium)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/globe.gl"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<div id="map" class="globe-container"></div>

<main class="ui-layer">
  <div class="glass-panel">
    <header class="intro">
      <div class="logo">Aero.</div>
      <h1>Global Weather</h1>
      <p>Explore conditions worldwide on a 3D Earth.</p>
    </header>

    <section class="search-block" aria-label="Search by city name">
      <form id="search-form" class="search-form" autocomplete="off">
        <div class="input-wrapper">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input
            type="text"
            id="city-input"
            name="city"
            placeholder="Search a city..."
            aria-label="City name"
          >
        </div>
        <button type="submit" id="search-btn">Find</button>
      </form>
      <div id="suggestions" class="suggestions" hidden></div>
    </section>

    <div class="divider" role="separator">
      <span>or map selection</span>
    </div>

    <button type="button" id="locate-btn" class="locate-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
      Current Location
    </button>

    <section id="results" class="results" aria-live="polite">
      <!-- state markup is swapped in by script.js -->
    </section>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
